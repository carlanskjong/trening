name: Update dashboard
run-name: ${{ inputs.reason || github.event_name }}

on:
  schedule:
    - cron: "17 * * * *"   # every hour - in practice GitHub runs it every few hours; the doorbell is the fast path
  # The "Run workflow" button, the app's Refresh button (Settings) and Strava's
  # doorbell on Netlify (webhook/) all start a build this way. It needs only a
  # token with "Actions: Read and write", which cannot change the code.
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this build (shown in the list of runs)"
        required: false
        default: "Run by hand"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: Fetch Strava data and build the page
        env:
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python build_site.py

      - name: Save the Strava login and the cached run detail, keep the schedule alive
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          # token.enc = the refreshed Strava login, cache/ = per-run heart-rate detail.
          # Both are encrypted; without them every build would re-fetch everything.
          git add token.enc cache 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Strava login and run cache [skip ci]"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3456000 ]; then
            git commit --allow-empty -m "Keep hourly schedule active [skip ci]"
          fi
          git push || echo "Nothing to push"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
